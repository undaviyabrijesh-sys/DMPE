name: DMPE execution-cost simulation

on:
  push:
    paths:
      - ".github/workflows/execution-simulation.yml"
      - "src/dmpe/execution_sim.py"
      - "scripts/run_execution_simulation.py"
      - "tests/test_execution_sim.py"
  workflow_dispatch:
    inputs:
      walk_forward_run_id:
        description: "Run ID containing dmpe-walk-forward-evaluation artifact"
        required: true
        default: "41492585989"
        type: string
      feature_run_id:
        description: "Run ID containing dmpe-stage1-feature-engineering artifact"
        required: true
        default: "41490148033"
        type: string
      history_run_id:
        description: "Run ID containing dmpe-historical-data artifact"
        required: true
        default: "41481361783"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dmpe-execution-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out DMPE
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download repeated walk-forward signals
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.walk_forward_run_id || '41492585989' }}
          name: dmpe-walk-forward-evaluation
          path: wf_input

      - name: Download Stage 1 feature dataset
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.feature_run_id || '41490148033' }}
          name: dmpe-stage1-feature-engineering
          path: stage1_input

      - name: Download historical traded-price candles
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.history_run_id || '41481361783' }}
          name: dmpe-historical-data-${{ github.event.inputs.history_run_id || '41481361783' }}
          path: history_input

      - name: Run fee and slippage sensitivity simulation
        run: |
          python scripts/run_execution_simulation.py \
            --signals-file wf_input/walk_forward_test_signals.csv \
            --price-file history_input/history/BTCUSD_1m.parquet \
            --feature-file stage1_input/processed/dmpe_BTCUSD_1m_features.parquet \
            --output-dir stage4_output \
            --fee-bps-per-side 5.9 \
            --slippage-scenarios-bps 0,1,2,5,10 \
            --lot-size-btc 0.001 \
            --contracts 1

      - name: Upload execution-cost report
        uses: actions/upload-artifact@v4
        with:
          name: dmpe-execution-cost-simulation
          path: stage4_output
          if-no-files-found: error
          retention-days: 30
