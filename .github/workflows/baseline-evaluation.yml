name: DMPE baseline model evaluation

on:
  push:
    paths:
      - ".github/workflows/baseline-evaluation.yml"
      - "scripts/evaluate_baselines.py"
      - "tests/test_evaluate_baselines.py"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      feature_run_id:
        description: "GitHub Actions run ID containing the Stage 1 feature artifact"
        required: true
        default: "41490148033"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out DMPE
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Stage 1 feature artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.feature_run_id || '41490148033' }}
          name: dmpe-stage1-feature-engineering
          path: stage1_input

      - name: Evaluate chronological baselines
        run: |
          python scripts/evaluate_baselines.py \
            --feature-file stage1_input/processed/dmpe_BTCUSD_1m_features.parquet \
            --schema-file stage1_input/processed/feature_schema.json \
            --output-dir stage2_output

      - name: Upload baseline evaluation
        uses: actions/upload-artifact@v4
        with:
          name: dmpe-baseline-evaluation
          path: stage2_output
          if-no-files-found: error
          retention-days: 30
