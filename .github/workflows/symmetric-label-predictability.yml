name: DMPE symmetric-label predictability screen

on:
  push:
    paths:
      - ".github/workflows/symmetric-label-predictability.yml"
      - "scripts/evaluate_symmetric_label_predictability.py"
      - "tests/test_symmetric_label_predictability.py"
      - "src/dmpe/labels.py"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/symmetric-label-predictability.yml"
      - "scripts/evaluate_symmetric_label_predictability.py"
      - "tests/test_symmetric_label_predictability.py"
      - "src/dmpe/labels.py"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      feature_run_id:
        description: "Successful Stage 1 feature-engineering run ID"
        required: true
        default: "41509621537"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dmpe-symmetric-label-screen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  symmetric-label-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out DMPE
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run focused tests
        run: pytest -q tests/test_symmetric_label_predictability.py tests/test_labels.py

      - name: Download frozen Stage 1 feature artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.feature_run_id || '41509621537' }}
          name: dmpe-stage1-feature-engineering
          path: stage1_input

      - name: Run train-validation-only predictability screen
        run: |
          python scripts/evaluate_symmetric_label_predictability.py \
            --feature-file stage1_input/processed/dmpe_BTCUSD_1m_features.parquet \
            --schema-file stage1_input/processed/feature_schema.json \
            --output-dir symmetric_label_output

      - name: Upload screening report
        uses: actions/upload-artifact@v4
        with:
          name: dmpe-symmetric-label-screen-${{ github.run_id }}
          path: symmetric_label_output
          if-no-files-found: error
          retention-days: 30
